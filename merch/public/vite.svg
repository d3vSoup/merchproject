<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- T-shirt / hanger icon representing apparel store -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#FF9F4A"/>
    </linearGradient>
  </defs>
  <!-- Hanger hook -->
  <path d="M16 2 C16 2 14 2 14 4 C14 5.5 15.5 6 16 6" stroke="url(#g)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Hanger body -->
  <path d="M16 6 L6 14 L6 16 L26 16 L26 14 Z" fill="url(#g)" opacity="0.9"/>
  <!-- T-shirt body -->
  <rect x="8" y="16" width="16" height="12" rx="2" fill="url(#g)" opacity="0.85"/>
  <!-- T-shirt sleeves -->
  <path d="M8 16 L4 20 L6 22 L8 20" fill="url(#g)" opacity="0.75"/>
  <path d="M24 16 L28 20 L26 22 L24 20" fill="url(#g)" opacity="0.75"/>
  <!-- Neck cutout -->
  <ellipse cx="16" cy="16" rx="3" ry="1.5" fill="white" opacity="0.6"/>
</svg>